<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAS Web</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark;background:#101521;color:#e9eef8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;background:#29354e;color:#f4f8ff;cursor:pointer}button:hover{background:#374968}button.primary{background:#4c7bea}button:disabled{opacity:.4}input{border:1px solid #34415d;border-radius:9px;padding:11px;background:#172033;color:white;min-width:0}#login{min-height:100vh;display:grid;place-items:center;padding:16px}.card{background:#1b2639;padding:32px;border-radius:20px;width:min(420px,100%);box-shadow:0 12px 36px #080b1677}.card form{display:grid;gap:14px}.card h1{margin:0 0 12px}.hint{color:#a9b8d4;font-size:13px}header{height:69px;border-bottom:1px solid #303d54;display:flex;align-items:center;justify-content:space-between;padding:0 21px;gap:12px}main{display:flex;min-height:calc(100vh - 69px)}aside{width:240px;padding:20px 14px;border-right:1px solid #303d54;flex-shrink:0}aside button{width:100%;display:block;text-align:left;margin:5px 0;overflow:hidden;text-overflow:ellipsis}.selected{background:#365eb5!important}section{padding:22px;min-width:0;flex:1}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0}#crumb{font-size:17px;word-break:break-all}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}.tile{min-width:0;background:#1d2b42;border:1px solid #30415f;border-radius:14px;padding:14px;text-align:center;cursor:pointer;position:relative}.tile:hover{border-color:#6a98f5}.tile .icon{font-size:42px;height:74px;display:flex;align-items:center;justify-content:center}.tile .icon img{width:100%;height:74px;object-fit:contain}.name{overflow-wrap:anywhere;font-size:14px}.meta{color:#9eb1d0;font-size:12px;margin-top:5px}.actions{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}.actions button{padding:5px 8px;font-size:12px}#status{min-height:22px;color:#fdca7a}#preview{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:4;padding:15px}#preview img,#preview video,#preview iframe{max-width:95vw;max-height:85vh;width:auto;border:0}#preview iframe{width:85vw;height:80vh;background:white}.hidden{display:none!important}@media(max-width:650px){main{display:block}aside{width:100%;border-right:0;border-bottom:1px solid #303d54;padding:10px;display:flex;overflow-x:auto}aside button{width:auto;white-space:nowrap;flex:0 0 auto}section{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:0 12px}.card{padding:22px}}
</style></head><body><div id="login"><div class="card"><h1>☁ NAS Web</h1><p class="hint">Войди с логином и паролем от Simple NAS (SMB).</p><form id="loginForm"><input id="username" autocomplete="username" placeholder="Логин" required><input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required><button class="primary">Войти</button></form><p id="loginError" style="color:#ff9f9f"></p></div></div>
<div id="app" class="hidden"><header><strong>☁ NAS Web</strong><div><span id="who"></span> <button id="logout">Выйти</button></div></header><main><aside id="shares"></aside><section><div id="crumb">Выберите папку слева</div><div class="toolbar"><button id="up">⬆ Назад</button><button id="folder">＋ Папка</button><label class="primary" style="background:#4c7bea;border-radius:9px;padding:10px 13px;cursor:pointer">⤒ Загрузить <input id="upload" type="file" multiple hidden></label><button id="refresh">↻ Обновить</button></div><p id="status"></p><div class="grid" id="entries"></div></section></main></div>
<div id="preview"><button id="closePreview" style="margin-bottom:12px">✕ Закрыть</button><div id="previewBody"></div></div>
<script src="/static/app.js" defer></script></body></html>
