<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151f"><title>NAS Web</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0d1119;--panel:#151b27;--panel2:#1d2635;--border:#2b3649;--text:#edf2fa;--muted:#9aa9bd;--accent:#7ba8ff;--accentbg:#243c66;--danger:#ff9797}
:root[data-theme=light]{color-scheme:light;--bg:#f6f8fc;--panel:#fff;--panel2:#eef2f9;--border:#dce3ee;--text:#182339;--muted:#637389;--accent:#2667cf;--accentbg:#e4edff;--danger:#c32d35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 13px;min-height:42px;cursor:pointer;touch-action:manipulation}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}.primary:hover{filter:brightness(1.1)}input,select{min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 13px}.hidden{display:none!important}
#login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginCard{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:32px}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:750;letter-spacing:-.5px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--accentbg);color:var(--accent);font-size:22px}.loginCard h1{font-size:25px;margin:27px 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.loginCard form{display:grid;gap:13px;margin-top:25px}.loginCard form input,.loginCard form button{width:100%}#loginError{color:var(--danger);min-height:19px;font-size:13px}
#app{min-height:100dvh;display:flex;flex-direction:column}.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 26px;border-bottom:1px solid var(--border)}.topRight{display:flex;align-items:center;gap:12px}.topRight #who{color:var(--muted);font-size:13px}.shell{display:flex;flex:1;min-height:0}.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);padding:22px 14px}#shares{width:100%}.sidebarTitle{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.2px;padding:0 14px;margin-bottom:12px}.share{width:100%;display:block;text-align:left;margin:4px 0;background:transparent;border:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.share.selected{background:var(--accentbg);color:var(--accent)}.workspace{flex:1;min-width:0;padding:26px 30px;max-width:1700px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font-size:12px;color:var(--muted);margin:0 0 7px}.path{font-size:23px;letter-spacing:-.5px;font-weight:750;overflow-wrap:anywhere}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:22px 0 14px}.uploadLabel{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:10px 15px;min-height:42px;cursor:pointer;touch-action:manipulation}.search{flex:1;min-width:130px;max-width:340px}.controls select{max-width:165px}.viewButtons{display:flex;gap:3px;background:var(--panel2);padding:3px;border-radius:12px}.viewButtons button{border:0;padding:5px 10px;min-height:34px;background:transparent}.viewButtons button.active{background:var(--accentbg);color:var(--accent)}.status{color:var(--muted);min-height:26px;font-size:13px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:15px}.item{background:var(--panel);border:1px solid var(--border);border-radius:17px;min-width:0;overflow:hidden;position:relative}.item:hover{border-color:var(--accent)}.thumb{width:100%;height:132px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb{color:var(--accent);font-family:system-ui,sans-serif;font-weight:400}.item:focus-within{border-color:var(--accent)}.details{padding:12px 13px}.filename{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filemeta{font-size:11px;color:var(--muted);margin-top:5px}.more{position:absolute;top:8px;right:8px;border-radius:10px;border:1px solid var(--border);min-height:36px;padding:5px 12px;background:var(--panel);font-weight:750}.items.list{display:block}.items.list .item{display:flex;align-items:center;margin-bottom:7px;border-radius:12px;min-height:66px}.items.list .thumb{width:66px;height:64px;flex-shrink:0;font-size:26px}.items.list .details{flex:1;min-width:0}.items.list .more{position:static;margin-right:10px}
#fileMenu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--border);box-shadow:0 18px 60px #0005;border-radius:15px;padding:7px;min-width:190px}#fileMenu button{display:block;width:100%;text-align:left;border:0;background:transparent}#fileMenu button.danger{color:var(--danger)}
#preview{position:fixed;inset:0;z-index:40;background:#05070cef;display:none;flex-direction:column;align-items:center;justify-content:center;padding:22px}.previewTop{position:absolute;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff}.previewTop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65vw}.previewContent{max-width:100%;max-height:83dvh;display:flex;align-items:center;justify-content:center}.previewContent img,.previewContent video{display:block;max-width:94vw;max-height:80dvh;object-fit:contain}.previewContent iframe{width:min(900px,90vw);height:80dvh;border:0;background:white}.previewNav{position:absolute;bottom:20px;display:flex;gap:10px}
.drop{outline:3px dashed var(--accent);outline-offset:-9px;background:var(--accentbg)}#uploadProgress{height:4px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-top:5px}#uploadProgress>div{height:100%;width:0;background:var(--accent);transition:width .12s}
@media(max-width:760px){.top{height:62px;padding:0 15px}.top .brand{font-size:18px}.topRight #who{display:none}.topRight button{min-height:38px;padding:7px 10px}.shell{display:block}.sidebar{width:100%;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--border);scrollbar-width:none}.sidebarTitle{display:none}#shares{display:flex;gap:6px;width:max-content}.share{width:auto;max-width:190px;flex:0 0 auto;white-space:nowrap;margin:0;padding:9px 12px}.workspace{padding:17px 14px 100px}.path{font-size:19px}.controls{gap:8px;margin:18px 0 10px}.controls button,.controls select{min-height:41px}.search{order:-1;flex-basis:100%;max-width:none}.items{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:124px}.details{padding:11px}.filename{font-size:12px}.filemeta{font-size:11px}.uploadLabel{padding:10px 12px}.loginCard{padding:24px}.previewContent iframe{width:95vw}.previewNav{bottom:12px}}
@media(max-width:370px){.items{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:100px}.controls select{max-width:125px}}
</style></head><body>
<div id="login"><div class="loginCard"><div class="brand"><span class="logo">◈</span> NAS Web</div><h1>Ваши файлы, всегда рядом.</h1><div class="sub">Используйте свою учётную запись Simple NAS.</div><form id="loginForm"><input id="username" autocomplete="username" placeholder="Логин" required aria-label="Логин"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required aria-label="Пароль"><button class="primary">Войти</button></form><p id="loginError" role="alert"></p></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand"><span class="logo">◈</span> NAS Web</div><div class="topRight"><span id="who"></span><button id="theme" aria-label="Сменить тему">◐</button><button id="logout">Выйти</button></div></header><div class="shell"><aside class="sidebar" aria-label="Доступные папки"><div class="sidebarTitle">МОИ ПАПКИ</div><div id="shares"></div></aside><section class="workspace" id="workspace"><div class="head"><div><p class="eyebrow">ФАЙЛЫ И ПАПКИ</p><div class="path" id="crumb">Выберите хранилище</div></div></div>
<div class="controls"><input class="search" id="search" type="search" placeholder="Поиск в этой папке…" aria-label="Поиск файлов"><button id="up" title="На уровень выше">← Назад</button><button id="folder">＋ Папка</button><label class="primary uploadLabel">↑ Загрузить<input id="upload" type="file" multiple hidden></label><button id="refresh" title="Обновить">⟳</button><select id="sort" aria-label="Сортировка"><option value="name">По имени</option><option value="new">Сначала новые</option><option value="size">По размеру</option></select><div class="viewButtons"><button id="gridView" class="active" title="Плитки" aria-label="Плитки">▦</button><button id="listView" title="Список" aria-label="Список">☰</button></div></div><div class="status" id="status" role="status"></div><div id="uploadProgress" class="hidden"><div id="progressFill"></div></div><div class="items" id="entries"></div></section></div></div>
<div id="fileMenu" class="hidden" role="menu"></div>
<div id="preview"><div class="previewTop"><span id="previewTitle"></span><button id="closePreview">✕ Закрыть</button></div><div class="previewContent" id="previewBody"></div><div class="previewNav"><button id="prevPreview">←</button><button id="nextPreview">→</button></div></div>
<script src="/static/app.js" defer></script></body></html>
