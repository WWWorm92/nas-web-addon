</style><style>
#preview{padding:0;display:none;background:#070a10;justify-content:stretch;align-items:stretch;overflow:hidden;color:#f4f7ff}

height:66px;padding:0;border-radius:9px;border:2px solid transparent;background:#253248;overflow:hidden;min-height:0;opacity:.65;transition:transform .17s ease,opacity .17s ease,border-color .17s ease}.filmstrip button.active{border-color:#82acff;opacity:1;transform:scale(1.07)}.filmstrip button img{width:100%;height:100%;object-fit:cover;display:block}.filmstrip button span{display:grid;place-items:center;width:100%;height:100%;font-size:18px;color:#93b2ee}

.vectorIcon{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.vectorIcon svg{width:24px;height:24px}

.items.list .thumb .vectorIcon svg{width:29px;height:29px}

.item{cursor:pointer;transition:border-color .12s ease,background .12s ease}
.item:active{background:var(--panel2)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filename,.filemeta{pointer-events:none}
.items.list .item{padding-right:0}

/* 0.8.3: distraction-free photo viewer */
#preview .photoHeader,#preview .filmstrip{transition:opacity .22s ease,transform .22s ease,visibility .22s}
#preview.controlsHidden .photoHeader{opacity:0;visibility:hidden;transform:translateY(-16px);pointer-events:none}

#preview.controlsHidden .photoStage{top:0;bottom:0}

}

@media(prefers-reduced-motion:reduce){

<div id="login"><div class="authShell"><div class="authLogo"><span class="logo">◈</span><span>NAS<span class="authAccent">Web</span></span></div><div class="loginCard"><div class="authHeading"><div class="authEyebrow">ЛИЧНОЕ ОБЛАКО</div><h1>С возвращением</h1><p class="sub">Войдите, чтобы получить доступ к своим файлам и фотографиям.</p></div><form id="loginForm"><label for="username">Имя пользователя</label><input id="username" autocomplete="username" placeholder="Ваш логин Simple NAS" required aria-label="Логин" spellcheck="false"><label for="password">Пароль</label><div class="passwordBox"><input id="password" type="password" autocomplete="current-password" placeholder="Введите пароль" required aria-label="Пароль"><button type="button" id="togglePassword" aria-label="Показать пароль">Показать</button></div><button id="submitLogin" class="primary">Войти в NAS Web <span aria-hidden="true">→</span></button></form><p id="loginError" role="alert" aria-live="polite"></p></div><div class="authFooter">Защищённый доступ · Учётная запись Simple NAS</div></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand"><span class="logo">◈</span> NAS Web</div><div class="topRight"><span id="who"></span><button id="theme" aria-label="Сменить тему">◐</button><button id="logout">Выйти</button></div></header><div class="shell"><aside class="sidebar" aria-label="Доступные папки"><div class="sidebarTitle">МОИ ПАПКИ</div><div id="shares"></div></aside><section class="workspace" id="workspace"><div class="head"><div><p class="eyebrow">ФАЙЛЫ И ПАПКИ</p><div class="path" id="crumb">Выберите хранилище</div></div></div>
<div class="controls"><input class="search" id="search" type="search" placeholder="Поиск в этой папке…" aria-label="Поиск файлов"><button id="up" title="На уровень выше">← Назад</button><button id="folder">＋ Папка</button><label class="primary uploadLabel">↑ Загрузить<input id="upload" type="file" multiple hidden></label><button id="refresh" title="Обновить">⟳</button><select id="sort" aria-label="Сортировка"><option value="name">По имени</option><option value="new">Сначала новые</option><option value="size">По размеру</option></select><div class="viewButtons"><button id="gridView" class="active" title="Плитки" aria-label="Плитки">▦</button><button id="listView" title="Список" aria-label="Список">☰</button></div></div><div class="status" id="status" role="status"></div><div id="uploadProgress" class="hidden"><div id="progressFill"></div></div><div class="items" id="entries"></div></section></div></div>
