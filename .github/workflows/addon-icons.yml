name: Build NAS Web icons
on:
  push:
    paths:
      - 'nas_web/app/icon.svg'
      - '.github/workflows/addon-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install Pillow==11.3.0
      - name: Generate matching PNG icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          for size, filename in [
              (128, "nas_web/icon.png"),
              (256, "nas_web/logo.png"),
              (192, "nas_web/app/icon-192.png"),
          ]:
              im = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              sc=size/256
              def box(coords):
                  return tuple(round(v*sc) for v in coords)
              d.rounded_rectangle(box((4,4,252,252)),radius=round(54*sc),fill="#17263b")
              d.rounded_rectangle(box((48,66,208,190)),radius=round(22*sc),
                                  outline="#87b3ff",width=max(1,round(14*sc)))
              d.line(box((48,139,208,139)),fill="#87b3ff",width=max(1,round(12*sc)))
              for x in (80,110):
                  d.ellipse(box((x-8,156,x+8,172)),fill="#9bc5ff")
              d.line(box((154,164,180,164)),fill="#9bc5ff",width=max(1,round(11*sc)))
              path=Path(filename)
              path.parent.mkdir(parents=True,exist_ok=True)
              im.save(path,format="PNG",optimize=True)
          PY
      - name: Commit binary icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nas_web/icon.png nas_web/logo.png nas_web/app/icon-192.png
          if ! git diff --cached --quiet; then
            git commit -m "Build binary Home Assistant and mobile icons"
            git push
          fi
