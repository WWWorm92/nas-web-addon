name: NAS Web checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q nas_web/app
      - name: Remember-me login tests
        run: |
          pip install cryptography==46.0.3
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          from pathlib import Path
          from app import remember_auth
          with tempfile.TemporaryDirectory() as tmp:
              remember_auth.ROOT = Path(tmp) / "private"
              remember_auth.KEY = remember_auth.ROOT / "secret.key"
              remember_auth.DB = remember_auth.ROOT / "revoked.sqlite3"
              user = {"name": "tester", "password": "secret", "csrf": "token", "shares": ["HDD"]}
              cookie = remember_auth.issue(user)
              assert remember_auth.restore(cookie)["name"] == "tester"
              assert remember_auth.restore(cookie)["password"] == "secret"
              # Simulate application restart (the Fernet key must survive).
              remember_auth._cipher = None
              assert remember_auth.restore(cookie)["csrf"] == "token"
              remember_auth.revoke(cookie)
              remember_auth._cipher = None
              assert remember_auth.restore(cookie) is None
              assert remember_auth.restore("bad-cookie") is None
              assert remember_auth.KEY.stat().st_mode & 0o077 == 0
          print("Persistent remember-me recovery and revocation OK")
          PY
      - name: EXIF date index tests
        run: |
          pip install Pillow==11.3.0
          PYTHONPATH=nas_web python - <<'PY'
          import io
          import tempfile
          from pathlib import Path
          from PIL import Image
          from app import photo_dates

          with tempfile.TemporaryDirectory() as work:
              photo_dates.DB = Path(work) / "photo-dates.sqlite3"
              exif = Image.Exif()
              exif[36867] = "2019:06:21 12:34:56"
              source = io.BytesIO()
              Image.new("RGB", (10, 10)).save(source, format="JPEG", exif=exif)
              source.seek(0)
              assert photo_dates.parse_exif(source) == "2019-06-21T12:34:56"
              assert photo_dates.lookup("user", "disk", "photo.jpg", 1, 100) == (False, None)
              photo_dates.save("user", "disk", "photo.jpg", 1, 100, "2019-06-21T12:34:56")
              assert photo_dates.lookup("user", "disk", "photo.jpg", 1, 100) == (True, "2019-06-21T12:34:56")
              assert photo_dates.lookup("other", "disk", "photo.jpg", 1, 100) == (True, "2019-06-21T12:34:56")
          print("EXIF and metadata cache OK")
          PY
      - name: Shared metadata and resumable index tests
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from app import gallery_index as g
          def photo(name, mtime=100):
              return SimpleNamespace(filename=name,isDirectory=False,file_size=120,last_write_time=mtime)
          with tempfile.TemporaryDirectory() as tmp:
              g.DB=Path(tmp)/"gallery.sqlite3"
              a,b=g.key("alice"),g.key("bob")
              with g.connect() as db:
                  g.begin(db,a,["Disk"])
                  g.add_folder_contents(db,a,"Disk","",[photo("same.jpg")])
                  g.save_date(db,a,"Disk","same.jpg","2020-01-01T12:00:00")
                  assert g.pending_folder(db,a) is None
                  db.execute("UPDATE jobs SET complete=1 WHERE owner=?",(a,))
                  g.begin(db,b,["Disk"])
                  db.commit()
                  assert g.page(b,["Disk"],0,10)==[]
                  g.add_folder_contents(db,b,"Disk","",[photo("same.jpg")])
                  assert g.next_unchecked(db,b,["Disk"]) is None
                  db.commit()
                  assert g.page(b,["Disk"],0,10)[0]["taken"]=="2020-01-01T12:00:00"
                  g.begin(db,a,["Disk"])
                  assert g.pending_folder(db,a) is None
                  db.execute("UPDATE jobs SET started=0 WHERE owner=?",(a,))
                  g.begin(db,a,["Disk"])
                  assert g.pending_folder(db,a) is not None
                  g.add_folder_contents(db,a,"Disk","",[photo("same.jpg")])
                  db.commit()
                  assert g.page(a,["Disk"],0,10)[0]["taken"]=="2020-01-01T12:00:00"
                  assert g.page(b,["Secret"],0,10)==[]
          print("Shared metadata, ACL isolation and resume OK")
          PY
      - name: Read-only SMB range access regression
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import sys
          from types import ModuleType
          # Test the adapter against an SMB backend requiring explicit read-only access.
          fake = ModuleType("impacket")
          backend = ModuleType("impacket.smbconnection")
          backend.SMBConnection = object
          sys.modules["impacket"] = fake
          sys.modules["impacket.smbconnection"] = backend
          from app.smb_compat import SMBConnection

          class ReadOnlyBackend:
              def __init__(self):
                  self.closed = False
                  self.disconnected = False
              def connectTree(self, share):
                  assert share == "Photos"
                  return 3
              def openFile(self, tid, path, **kwargs):
                  assert tid == 3 and path == r"\album\image.jpg"
                  # Impacket defaults to READ | WRITE; this share permits READ only.
                  assert kwargs.get("desiredAccess") == 0x00000001
                  assert kwargs.get("shareMode") == 0x00000007
                  return 5
              def readFile(self, tid, fid, offset, count):
                  assert tid == 3 and fid == 5 and offset == 0 and count == 5
                  return b"hello"
              def closeFile(self, tid, fid):
                  self.closed = True
              def disconnectTree(self, tid):
                  self.disconnected = True

          conn = SMBConnection("alice", "password", "test", "NAS")
          conn.conn = ReadOnlyBackend()
          assert b"".join(conn.iter_range("Photos", "/album/image.jpg", 0, 5)) == b"hello"
          assert conn.conn.closed and conn.conn.disconnected
          print("SMB range access requests read-only permission and cleans up handles")
          PY
      - name: EXIF resume and denied-access safety tests
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace
          from app import gallery_index as g, photo_dates
          def pic(name, mtime=100):
              return SimpleNamespace(filename=name,isDirectory=False,file_size=120,last_write_time=mtime)
          with tempfile.TemporaryDirectory() as tmp:
              g.DB=Path(tmp)/"gallery.sqlite3"
              photo_dates.DB=Path(tmp)/"cache.sqlite3"
              a,b=g.key("alice"),g.key("bob")
              with g.connect() as db:
                  g.begin(db,a,["Photos"])
                  g.add_folder_contents(db,a,"Photos","",[
                      pic("no-date.jpg"),pic("dated.jpg"),pic("denied.jpg")])
                  g.save_date(db,a,"Photos","no-date.jpg",None)
                  g.save_date(db,a,"Photos","dated.jpg","2020-01-01T11:22:33")
                  row=g.next_unchecked(db,a,["Photos"])
                  assert row["path"]=="denied.jpg"
                  g.mark_exif_denied(db,a,row)
              status=g.state(a,["Photos"])
              assert status["dates_pending"]==1
              assert status["dates_blocked"]==1
              assert status["dates_available"]==0
              assert status["checked_no_date"]==1
              with g.connect() as db:
                  # Repeating maintenance must not requeue known negative EXIF.
                  assert g.retry_missing_dates(db,a,["Photos"])==1
                  assert g.next_unchecked(db,a,["Photos"]) is None
                  assert db.execute("SELECT exif_checked FROM photos WHERE owner=? AND path='no-date.jpg'",(a,)).fetchone()[0]==1
                  assert db.execute("SELECT taken FROM photos WHERE owner=? AND path='dated.jpg'",(a,)).fetchone()[0]=="2020-01-01T11:22:33"
                  # Automatic retry after cooldown without losing photo records.
                  db.execute("UPDATE exif_denied SET retry_after=? WHERE owner=?",(time.time()-1,a))
                  assert g.next_unchecked(db,a,["Photos"])["path"]=="denied.jpg"
                  g.clear_exif_denied(db,a,"Photos","denied.jpg")
                  assert g.next_unchecked(db,a,["Photos"])["path"]=="denied.jpg"
                  # ACL failures scoped by user, not globally.
                  g.begin(db,b,["Photos"])
                  g.add_folder_contents(db,b,"Photos","",[pic("denied.jpg")])
                  assert g.next_unchecked(db,b,["Photos"])["path"]=="denied.jpg"
              # A cached "checked but no EXIF" result is valid metadata.
              photo_dates.save("alice","Photos","no-date.jpg",100.0,120,None)
              assert photo_dates.lookup("alice","Photos","no-date.jpg",100.0,120)==(True,None)
          print("EXIF negative results preserved; SMB ACL failures isolated and time-bounded")
          PY
      - name: Expire legacy SMB denial cooldown on upgrade
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace
          from app import gallery_index as g

          with tempfile.TemporaryDirectory() as tmp:
              g.DB = Path(tmp) / "gallery.sqlite3"
              owner = g.key("read-only")
              with g.connect() as db:
                  g.begin(db, owner, ["Disk"])
                  entry = SimpleNamespace(filename="locked.jpg",isDirectory=False,
                                          file_size=123,last_write_time=100)
                  g.add_folder_contents(db,owner,"Disk","",[entry])
                  row = g.next_unchecked(db,owner,["Disk"])
                  g.mark_exif_denied(db,owner,row)
                  # Simulate metadata created under the old read/write opener.
                  db.execute("DELETE FROM index_migrations WHERE name='exif_readonly_smb_open_0229'")
              with g.connect() as db:
                  # The repaired opener gets an immediate chance at re-reading.
                  assert g.next_unchecked(db,owner,["Disk"])["path"]=="locked.jpg"
                  assert db.execute("SELECT exif_checked FROM photos WHERE owner=?",(owner,)).fetchone()[0]==0
                  assert db.execute("SELECT COUNT(*) FROM photos").fetchone()[0]==1
                  db.execute("UPDATE exif_denied SET retry_after=? WHERE owner=?",
                             (time.time()+3600,owner))
              with g.connect() as db:
                  # Migration occurs only once; a new real ACL failure remains cooled down.
                  assert g.next_unchecked(db,owner,["Disk"]) is None
                  assert db.execute("SELECT COUNT(*) FROM photos").fetchone()[0]==1
          print("Legacy denial cooldowns expired once without altering photo index")
          PY
      - name: Unified gallery index tests
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from app import gallery_index as index
          with tempfile.TemporaryDirectory() as temp:
              index.DB = Path(temp) / "photos.sqlite3"
              owner=index.key("Alex")
              other=index.key("Olga")
              assert owner != other
              with index.LOCK, index.connect() as db:
                  index.begin(db, owner, ["Private"])
                  index.add_folder_contents(db, owner, "Private", "", [
                    SimpleNamespace(filename="Photos",isDirectory=True,file_size=0,last_write_time=1),
                    SimpleNamespace(filename="a.jpg",isDirectory=False,file_size=300,last_write_time=1650000000),
                    SimpleNamespace(filename="notes.txt",isDirectory=False,file_size=200,last_write_time=2)])
                  index.add_folder_contents(db, owner, "Private", "Photos", [
                    SimpleNamespace(filename="b.png",isDirectory=False,file_size=400,last_write_time=1660000000)])
              assert index.state(owner, ["Private"])["total"] == 2
              assert index.state(other, ["Private"])["total"] == 0
              assert index.page(owner, ["Private"], 0, 5)[0]["name"] == "b.png"
              assert index.page(owner, [], 0, 5) == []
              with index.LOCK, index.connect() as db:
                  index.save_date(db, owner, "Private", "a.jpg", "2025-06-07T09:11:00")
              assert index.page(owner, ["Private"], 0, 5)[0]["name"] == "a.jpg"
              assert index.state(owner, ["Private"])["dates_pending"] == 1
              assert index.state(owner, ["Other"])["total"] == 0
              assert index.state(owner, ["Other"])["pending"] >= 1
              index.reset(owner, ["Private"])
              assert index.state(owner, ["Private"])["total"] == 0
          print("Unified gallery index and access scoping OK")
          PY
      - name: JavaScript syntax
        run: |
          node --check nas_web/app/app.js
          node --check nas_web/app/admin.js
          sh -n nas_web/entrypoint.sh
      - name: Basic UI DOM contracts
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class IDs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, name, attributes):
                  a = dict(attributes)
                  if 'id' in a:
                      self.ids.add(a['id'])
          html = IDs()
          html.feed(Path("nas_web/app/index.html").read_text())
          js = Path("nas_web/app/app.js").read_text()
          missing = sorted(set(re.findall(r"el\('([^']+)'\)", js)) - html.ids)
          assert not missing, f"Missing DOM element IDs: {missing}"
          print("UI DOM IDs OK")
          PY
