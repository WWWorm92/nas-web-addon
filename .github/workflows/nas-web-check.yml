name: NAS Web checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q nas_web/app
      - name: PDF preview framing security tests
        run: PYTHONPATH=nas_web python -m unittest discover -s nas_web/tests -p 'test_pdf_frame_policy.py'
      - name: Remember-me login tests
        run: |
          pip install cryptography==46.0.3
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          from pathlib import Path
          from app import remember_auth
          with tempfile.TemporaryDirectory() as tmp:
              remember_auth.ROOT = Path(tmp) / "private"
              remember_auth.KEY = remember_auth.ROOT / "secret.key"
              remember_auth.DB = remember_auth.ROOT / "revoked.sqlite3"
              user = {"name": "tester", "password": "secret", "csrf": "token", "shares": ["HDD"]}
              cookie = remember_auth.issue(user)
              assert remember_auth.restore(cookie)["name"] == "tester"
              assert remember_auth.restore(cookie)["password"] == "secret"
              # Simulate application restart (the Fernet key must survive).
              remember_auth._cipher = None
              assert remember_auth.restore(cookie)["csrf"] == "token"
              remember_auth.revoke(cookie)
              remember_auth._cipher = None
              assert remember_auth.restore(cookie) is None
              assert remember_auth.restore("bad-cookie") is None
              assert remember_auth.KEY.stat().st_mode & 0o077 == 0
          print("Persistent remember-me recovery and revocation OK")
          PY
      - name: EXIF date index tests
        run: |
          pip install Pillow==11.3.0
          PYTHONPATH=nas_web python - <<'PY'
          import io
          import tempfile
          from pathlib import Path
          from PIL import Image
          from app import photo_dates

          with tempfile.TemporaryDirectory() as work:
              photo_dates.DB = Path(work) / "photo-dates.sqlite3"
              exif = Image.Exif()
              exif[36867] = "2019:06:21 12:34:56"
              source = io.BytesIO()
              Image.new("RGB", (10, 10)).save(source, format="JPEG", exif=exif)
              source.seek(0)
              assert photo_dates.parse_exif(source) == "2019-06-21T12:34:56"
              assert photo_dates.lookup("user", "disk", "photo.jpg", 1, 100) == (False, None)
              photo_dates.save("user", "disk", "photo.jpg", 1, 100, "2019-06-21T12:34:56")
              assert photo_dates.lookup("user", "disk", "photo.jpg", 1, 100) == (True, "2019-06-21T12:34:56")
              assert photo_dates.lookup("other", "disk", "photo.jpg", 1, 100) == (True, "2019-06-21T12:34:56")
          print("EXIF and metadata cache OK")
          PY
      - name: Shared metadata and resumable index tests
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from app import gallery_index as g
          def photo(name, mtime=100):
              return SimpleNamespace(filename=name,isDirectory=False,file_size=120,last_write_time=mtime)
          with tempfile.TemporaryDirectory() as tmp:
              g.DB=Path(tmp)/"gallery.sqlite3"
              a,b=g.key("alice"),g.key("bob")
              with g.connect() as db:
                  g.begin(db,a,["Disk"])
                  g.add_folder_contents(db,a,"Disk","",[photo("same.jpg")])
                  g.save_date(db,a,"Disk","same.jpg","2020-01-01T12:00:00")
                  assert g.pending_folder(db,a) is None
                  db.execute("UPDATE jobs SET complete=1 WHERE owner=?",(a,))
                  g.begin(db,b,["Disk"])
                  db.commit()
                  assert g.page(b,["Disk"],0,10)==[]
                  g.add_folder_contents(db,b,"Disk","",[photo("same.jpg")])
                  assert g.next_unchecked(db,b,["Disk"]) is None
                  db.commit()
                  assert g.page(b,["Disk"],0,10)[0]["taken"]=="2020-01-01T12:00:00"
                  g.begin(db,a,["Disk"])
                  assert g.pending_folder(db,a) is None
                  db.execute("UPDATE jobs SET started=0 WHERE owner=?",(a,))
                  g.begin(db,a,["Disk"])
                  assert g.pending_folder(db,a) is not None
                  g.add_folder_contents(db,a,"Disk","",[photo("same.jpg")])
                  db.commit()
                  assert g.page(a,["Disk"],0,10)[0]["taken"]=="2020-01-01T12:00:00"
                  assert g.page(b,["Secret"],0,10)==[]
          print("Shared metadata, ACL isolation and resume OK")
          PY
