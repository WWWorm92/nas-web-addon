      - name: Recycle, restore, and 14-day retention regressions
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace
          from cryptography.fernet import Fernet
          from app import trash_delete as trash, trash_store as store

          class Entry:
              def __init__(self,name,directory=False,link=False):
                  self.filename=name
                  self.isDirectory=directory
                  self.isReparsePoint=link

          class FakeSMB:
              def __init__(self,tree):
                  self.tree=tree
                  self.ops=[]
              def listPath(self,share,path):
                  assert share=="Photo"
                  return self.tree[path.lstrip("/")]
              def deleteFiles(self,share,path):
                  self.ops.append(("file",path))
              def deleteDirectory(self,share,path):
                  self.ops.append(("dir",path))

          root=".recycle/Katya"
          tree={
              root:[Entry(".",True),Entry("..",True),
                    Entry("first.jpg"),Entry("nested",True)],
              root+"/nested":[Entry("second.jpg"),Entry("deep",True)],
              root+"/nested/deep":[Entry("third.jpg")]
          }
          smb=FakeSMB(tree)
          files,dirs=trash.deletion_plan(smb,"Photo",root,True)
          assert len(files)==3 and len(dirs)==3 and not smb.ops
          assert dirs[-1]==root
          assert trash.permanent_delete(smb,"Photo",root,True)==6
          assert smb.ops[-1]==("dir","/"+root)
          assert all(path.startswith("/.recycle/Katya") for _,path in smb.ops)
          for bad in ("", ".recycle", "Photo/x", ".recycle/../Photo",
                      ".recycle_trick/x", ".recycle/test:stream"):
              try:trash.deletion_plan(smb,"Photo",bad,False)
              except trash.TrashDeletionError:pass
              else:raise AssertionError("Unsafe path accepted: "+bad)
          link=FakeSMB({root:[Entry("file.jpg"),Entry("link",True,True)]})
          try:trash.permanent_delete(link,"Photo",root,True)
          except trash.TrashDeletionError:pass
          else:raise AssertionError("Directory symlink accepted")
          assert not link.ops
          # No extra user-imposed cap of 5,000 entries or 64 levels.
          big=FakeSMB({root:[Entry("f"+str(i)+".jpg") for i in range(5100)]})
          assert len(trash.deletion_plan(big,"Photo",root,True)[0])==5100
          assert not big.ops

          with tempfile.TemporaryDirectory() as tmp:
              store.DB=Path(tmp)/"trash.sqlite3"
              key=Fernet.generate_key()
              store._cipher=lambda: Fernet(key)
              user={"name":"Katya","password":"test secret","shares":["Photo"]}
              with store.connect() as db:
                  assert not db.execute("SELECT 1 FROM cleanup_credentials").fetchone()
              store.register_legacy(user,"Photo",[])
              with store.connect() as db:
                  assert not db.execute("SELECT 1 FROM cleanup_credentials").fetchone()
              old=1234567890.
              store.record_move(user,"Photo","summer.jpg","Katya/2018/summer.jpg",False,now=old)
              legacy=[Entry("old-folder",True),Entry("summer.jpg")]
              store.register_legacy(user,"Photo",legacy,now=old+1000)
              tracked=store.item("Photo","summer.jpg")
              unknown=store.item("Photo","old-folder")
              assert tracked["original_path"]=="Katya/2018/summer.jpg"
              assert tracked["deleted_at"]==old
              assert unknown["original_path"] is None
              assert unknown["deleted_at"]==old+1000
              assert store.due(old+store.RETENTION_SECONDS-1)==[]
              expired=store.due(old+store.RETENTION_SECONDS)
              assert len(expired)==1 and expired[0]["trash_name"]=="summer.jpg"
              assert store.credentials(expired[0])=={
                  "name":"Katya","password":"test secret"}
              store.forget("Photo","summer.jpg")
              assert store.item("Photo","summer.jpg") is None
              assert store.item("Photo","old-folder") is not None
              store.forget("Photo","old-folder")
              with store.connect() as db:
                  assert not db.execute("SELECT 1 FROM cleanup_credentials").fetchone()
          print("Recycle restoration metadata, unlimited folders and 14-day retention passed")
          PY
