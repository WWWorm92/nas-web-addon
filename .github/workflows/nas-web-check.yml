      - name: EXIF resume and denied-access safety tests
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace
          from app import gallery_index as g, photo_dates
          def pic(name, mtime=100):
              return SimpleNamespace(filename=name,isDirectory=False,file_size=120,last_write_time=mtime)
          with tempfile.TemporaryDirectory() as tmp:
              g.DB=Path(tmp)/"gallery.sqlite3"
              photo_dates.DB=Path(tmp)/"cache.sqlite3"
              a,b=g.key("alice"),g.key("bob")
              with g.connect() as db:
                  g.begin(db,a,["Photos"])
                  g.add_folder_contents(db,a,"Photos","",[
                      pic("no-date.jpg"),pic("dated.jpg"),pic("denied.jpg")])
                  g.save_date(db,a,"Photos","no-date.jpg",None)
                  g.save_date(db,a,"Photos","dated.jpg","2020-01-01T11:22:33")
                  row=g.next_unchecked(db,a,["Photos"])
                  assert row["path"]=="denied.jpg"
                  g.mark_exif_denied(db,a,row)
              status=g.state(a,["Photos"])
              assert status["dates_pending"]==1
              assert status["dates_blocked"]==1
              assert status["dates_available"]==0
              assert status["checked_no_date"]==1
              with g.connect() as db:
                  # Repeating maintenance must not requeue known negative EXIF.
                  assert g.retry_missing_dates(db,a,["Photos"])==1
                  assert g.next_unchecked(db,a,["Photos"]) is None
                  assert db.execute("SELECT exif_checked FROM photos WHERE owner=? AND path='no-date.jpg'",(a,)).fetchone()[0]==1
                  assert db.execute("SELECT taken FROM photos WHERE owner=? AND path='dated.jpg'",(a,)).fetchone()[0]=="2020-01-01T11:22:33"
                  # Automatic retry after cooldown without losing photo records.
                  db.execute("UPDATE exif_denied SET retry_after=? WHERE owner=?",(time.time()-1,a))
                  assert g.next_unchecked(db,a,["Photos"])["path"]=="denied.jpg"
                  g.clear_exif_denied(db,a,"Photos","denied.jpg")
                  assert g.next_unchecked(db,a,["Photos"])["path"]=="denied.jpg"
                  # ACL failures scoped by user, not globally.
                  g.begin(db,b,["Photos"])
                  g.add_folder_contents(db,b,"Photos","",[pic("denied.jpg")])
                  assert g.next_unchecked(db,b,["Photos"])["path"]=="denied.jpg"
              # A cached "checked but no EXIF" result is valid metadata.
              photo_dates.save("alice","Photos","no-date.jpg",100.0,120,None)
              assert photo_dates.lookup("alice","Photos","no-date.jpg",100.0,120)==(True,None)
          print("EXIF negative results preserved; SMB ACL failures isolated and time-bounded")
          PY
      - name: Expire legacy SMB denial cooldown on upgrade
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace
          from app import gallery_index as g

          with tempfile.TemporaryDirectory() as tmp:
              g.DB = Path(tmp) / "gallery.sqlite3"
              owner = g.key("read-only")
              with g.connect() as db:
                  g.begin(db, owner, ["Disk"])
                  entry = SimpleNamespace(filename="locked.jpg",isDirectory=False,
                                          file_size=123,last_write_time=100)
                  g.add_folder_contents(db,owner,"Disk","",[entry])
                  row = g.next_unchecked(db,owner,["Disk"])
                  g.mark_exif_denied(db,owner,row)
                  # Simulate metadata created under the old read/write opener.
                  db.execute("DELETE FROM index_migrations WHERE name='exif_readonly_smb_open_0229'")
              with g.connect() as db:
                  # The repaired opener gets an immediate chance at re-reading.
                  assert g.next_unchecked(db,owner,["Disk"])["path"]=="locked.jpg"
                  assert db.execute("SELECT exif_checked FROM photos WHERE owner=?",(owner,)).fetchone()[0]==0
                  assert db.execute("SELECT COUNT(*) FROM photos").fetchone()[0]==1
                  db.execute("UPDATE exif_denied SET retry_after=? WHERE owner=?",
                             (time.time()+3600,owner))
              with g.connect() as db:
                  # Migration occurs only once; a new real ACL failure remains cooled down.
                  assert g.next_unchecked(db,owner,["Disk"]) is None
                  assert db.execute("SELECT COUNT(*) FROM photos").fetchone()[0]==1
          print("Legacy denial cooldowns expired once without altering photo index")
          PY
      - name: Per-user admin EXIF totals and index preservation
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from app import gallery_index as g
          def file(name):
              return SimpleNamespace(filename=name,isDirectory=False,file_size=100,last_write_time=100)
          with tempfile.TemporaryDirectory() as tmp:
              g.DB=Path(tmp)/"gallery.sqlite3"
              a,b=g.key("alice"),g.key("bob")
              with g.connect() as db:
                  g.begin(db,a,["Photos"])
                  g.add_folder_contents(db,a,"Photos","",[
                      file("dated.jpg"),file("no-date.jpg"),file("denied.jpg")])
                  g.save_date(db,a,"Photos","dated.jpg","2018-07-26T12:00:00")
                  g.save_date(db,a,"Photos","no-date.jpg",None)
                  row=g.next_unchecked(db,a,["Photos"])
                  assert row["path"]=="denied.jpg"
                  g.mark_exif_denied(db,a,row)
                  g.begin(db,b,["Private"])
                  g.add_folder_contents(db,b,"Private","",[file("new.jpg")])
                  before=db.execute("SELECT owner,share,path,taken,exif_checked FROM photos ORDER BY owner,path").fetchall()
                  groups={r["owner"]:r for r in g.summaries_by_owner(db)}
                  assert len(groups)==2
                  assert groups[a]["photos"]==3 and groups[b]["photos"]==1
                  assert groups[a]["dated"]==1 and groups[a]["checked_without_date"]==1
                  assert groups[a]["pending"]==1 and groups[a]["blocked"]==1
                  assert groups[a]["actionable"]==0
                  assert groups[b]["pending"]==1 and groups[b]["blocked"]==0
                  assert groups[b]["actionable"]==1
                  after=db.execute("SELECT owner,share,path,taken,exif_checked FROM photos ORDER BY owner,path").fetchall()
                  assert [tuple(x) for x in before]==[tuple(x) for x in after]
              assert g.page(a,["Photos"],0,10,"taken")[0]["name"]=="dated.jpg"
              assert g.page(a,["Photos"],0,10,"modified")[0]["name"]=="dated.jpg"
          print("Admin counts are per owner, aggregated totals are separate and dates are unchanged")
          PY
