      - name: Read-only SMB range access regression
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import sys
          from types import ModuleType
          # Test the adapter against an SMB backend requiring explicit read-only access.
          fake = ModuleType("impacket")
          backend = ModuleType("impacket.smbconnection")
          backend.SMBConnection = object
          sys.modules["impacket"] = fake
          sys.modules["impacket.smbconnection"] = backend
          from app.smb_compat import SMBConnection

          class ReadOnlyBackend:
              def __init__(self):
                  self.closed = False
                  self.disconnected = False
              def connectTree(self, share):
                  assert share == "Photos"
                  return 3
              def openFile(self, tid, path, **kwargs):
                  assert tid == 3 and path == r"\album\image.jpg"
                  # Impacket defaults to READ | WRITE; this share permits READ only.
                  assert kwargs.get("desiredAccess") == 0x00000001
                  assert kwargs.get("shareMode") == 0x00000007
                  return 5
              def readFile(self, tid, fid, offset, count):
                  assert tid == 3 and fid == 5 and offset == 0 and count == 5
                  return b"hello"
              def closeFile(self, tid, fid):
                  self.closed = True
              def disconnectTree(self, tid):
                  self.disconnected = True

          conn = SMBConnection("alice", "password", "test", "NAS")
          conn.conn = ReadOnlyBackend()
          assert b"".join(conn.iter_range("Photos", "/album/image.jpg", 0, 5)) == b"hello"
          assert conn.conn.closed and conn.conn.disconnected
          print("SMB range access requests read-only permission and cleans up handles")
          PY
      - name: Cached thumbnail SMB read rights and share-tree reuse
        run: |
          PYTHONPATH=nas_web python - <<'PY'
          import sys
          from types import ModuleType
          fake=ModuleType("impacket")
          backend=ModuleType("impacket.smbconnection")
          backend.SMBConnection=object
          sys.modules["impacket"]=fake
          sys.modules["impacket.smbconnection"]=backend
          from app.smb_compat import SMBConnection

          class FakeSMB:
              def __init__(self):
                  self.trees=0
                  self.opens=[]
                  self.closes=[]
                  self.disconnected=[]
                  self.closed=False
                  self.logged_off=False
              def connectTree(self, share):
                  assert share=="Photo"
                  self.trees+=1
                  return self.trees
              def openFile(self, tid, path, **kw):
                  assert kw["desiredAccess"]==1 and kw["shareMode"]==7
                  self.opens.append((tid,path))
                  if path=="\\denied.jpg":
                      raise PermissionError("SMB access denied")
                  return len(self.opens)
              def closeFile(self, tid, fid):
                  self.closes.append((tid,fid))
              def disconnectTree(self, tid):
                  self.disconnected.append(tid)
              def logoff(self):
                  self.logged_off=True
              def close(self):
                  self.closed=True

          adapter=SMBConnection("alice","secret","NASWEB","NAS")
          backend_conn=FakeSMB()
          adapter.conn=backend_conn
          assert adapter.can_read("Photo","/a.jpg")
          assert adapter.can_read("Photo","/b.jpg")
          assert backend_conn.trees==1, "Reused session should not reconnect share per photo"
          assert len(backend_conn.opens)==2, "Every file must get a fresh SMB read ACL check"
          assert len(backend_conn.closes)==2
          try:
              adapter.can_read("Photo","/denied.jpg")
          except PermissionError:
              pass
          else:
              raise AssertionError("Revoked SMB file read permission was bypassed")
          assert backend_conn.disconnected==[1]
          assert adapter.can_read("Photo","/c.jpg")
          assert backend_conn.trees==2, "ACL denial must invalidate cached SMB tree"
          adapter.close()
          assert backend_conn.disconnected==[1,2]
          assert backend_conn.logged_off and backend_conn.closed
          print("Repeated thumbnail hits reuse tree but recheck each file read permission")
          PY
